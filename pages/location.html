<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Kula C - Location</title>
    <!-- Google Fonts: Jost -->
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../navbar/navbar.css">
    <link rel="stylesheet" href="../css/location.css">
</head>
<body>
    <div id="site-menu"></div>

    <section class="location-section">
        <!-- Left Side: Dark Monochrome Google Map Embed -->
        <div class="map-container">
            <iframe 
                class="google-map"
                src="https://maps.google.com/maps?q=Diamond%20Mall%20Skopje&t=&z=16&ie=UTF8&iwloc=&output=embed" 
                frameborder="0" 
                scrolling="no" 
                marginheight="0" 
                marginwidth="0"
                allowfullscreen>
            </iframe>
            <div class="map-overlay-notice">Use ctrl + scroll to zoom the map</div>
        </div>

        <!-- Right Side: Location Info -->
        <div class="info-container">
            <div class="info-header">
                <h2>Diamond Kula C</h2>
                <span class="subtitle">Skopje, Macedonia</span>
            </div>

            <div class="location-details">
                <div class="detail-item">
                    <span class="label">Location:</span>
                    <p>Diamond Mall Complex (Near Signori)</p>
                </div>
                <div class="detail-item">
                    <span class="label">Opening Hours:</span>
                    <p>Monday – Saturday: 10:00 – 18:00<br>Sunday: 00:00 – 00:00</p>
                </div>
                <div class="detail-item">
                    <span class="label">Contact Info:</span>
                    <p>+389 (0)2 3000 500<br>info@diamondkula.mk</p>
                </div>
            </div>

            <div class="info-actions">
                <a href="https://maps.google.com/?q=Diamond+Mall+Skopje" target="_blank" rel="noopener noreferrer" class="luxury-btn">Get Directions</a>
            </div>
        </div>
    </section>


    <script src="../js/location.js" defer></script>
    <script src="../navbar/navbar.js" defer></script>

</body>
</html>
