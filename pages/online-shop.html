<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNORI</title>
    
    <!-- Tipografiq: Cormorant Garamond (logo) i Montserrat (navigaciq) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/online-shop.css">
    <style>

    </style>
</head>
<body>

    <div class="hero-section">
        <!-- Video pozadina -->
        <video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
            <source src="../assets/videa/The Arrival.mp4" type="video/mp4">
        </video>

        <!-- Navigaciq (Header) -->
        <header>
            <div class="nav-left">
                <div class="menu-container hover-target" role="button">
                    <div class="hamburger">
                        <span></span>
                        <span></span>
                    </div>
                    <span class="menu-text">Menu</span>
                </div>
            </div>

            <div class="nav-center">
                <a href="#" class="logo">SIGNORI</a>
            </div>

            <div class="nav-right">
                <a href="#" class="contact-text hover-target">+ Contact us</a>
                <button class="search-btn hover-target" aria-label="Search">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Dolen del (Footer) -->
        <footer>
            <!-- Kopche za Zvuk (Levo) -->
            <div class="footer-left">
                <button class="icon-btn hover-target" id="soundToggle" aria-label="Toggle Sound">
                    <svg id="soundIcon" viewBox="0 0 24 24">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </button>
            </div>

            <!-- Tekst vo Sredina -->
            <div class="footer-center">
                <h1 class="collection-title">Wedding Collection</h1>
                <a href="#" class="discover-btn">Discover</a>
            </div>

            <!-- Kopche za Pauza/Pley (Dqsno) -->
            <div class="footer-right">
                <button class="icon-btn hover-target" id="playPauseToggle" aria-label="Play/Pause Video">
                    <svg id="playPauseIcon" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="../js/online.js"></script>
</body>
</html>
