<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Appointment</title>
    <link rel="stylesheet" href="../css/request-appointment.css">
</head>
<body>
      <section class="contact-section">
        <div class="contact-container">
            <h1 class="contact-brand">SIGNORI</h1>
            <h2 class="contact-title">CONTACT US</h2>

            <form class="contact-form" action="#" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">Your First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Your Last Name</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <div class="form-submit">
                    <button type="submit" class="contact-submit-btn">Request Appointment</button>
                </div>
            </form>
        </div>
    </section>

    <script src="../js/request-appointment.js" defer></script>
</body>
</html>
