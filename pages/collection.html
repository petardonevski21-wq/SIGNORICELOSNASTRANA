<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection | SIGNORI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../navbar/navbar.css">
    <link rel="stylesheet" href="../css/collection.css">
</head>
<body>

    <div id="site-menu"></div>

    <div class="collection-toolbar" id="collectionToolbar">
        <button type="button" class="toolbar-btn" id="filterToggle">FILTERS</button>

        <div class="sort-wrapper">
            <label for="sortSelect" class="toolbar-label">SORT BY:</label>
            <select id="sortSelect" class="toolbar-select">
                <option value="featured">FEATURED</option>
                <option value="newest">NEWEST</option>
                <option value="price-asc">PRICE: LOW TO HIGH</option>
                <option value="price-desc">PRICE: HIGH TO LOW</option>
            </select>
        </div>
    </div>

    <main class="collection-container" id="collectionContainer">
        <div class="products-grid" id="productsGrid"></div>
    </main>

    <script src="../navbar/navbar.js"></script>
    <script src="../js/collection.js" defer></script>
</body>
</html>
